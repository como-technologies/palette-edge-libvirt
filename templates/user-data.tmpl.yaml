#cloud-config
# The cloud-init user-data for one lab host.
#
# scripts/seed-iso.sh replaces each placeholder and writes the result into a
# CIDATA ISO. The VM gets that ISO as a CD-ROM. A placeholder is a name between
# two at signs.
#
# The host boots a stock Ubuntu cloud image. cloud-init then installs the
# Palette agent. The lab builds no custom operating system image.
#
# Do not put your token in this file. The token comes from the project
# environment file at build time.

hostname: @HOSTNAME@
# The libvirt domain name and the Palette host name are the same. `just ls` and
# the Palette host list then agree.
preserve_hostname: false

users:
  - name: ubuntu
    groups: [adm, sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    shell: /bin/bash
    lock_passwd: false
    plain_text_passwd: @HOST_PASSWORD@

# Give a login on the serial console. Use `just console <name>`.
ssh_pwauth: true

# ANCHOR: packages
# The agent install script tests for these commands and stops without them.
# The agent itself needs the network and time packages.
package_update: true
packages:
  - jq
  - zstd
  - rsync
  - conntrack
  - iptables
  - rsyslog
  - systemd-timesyncd
  - curl
# ANCHOR_END: packages

write_files:
  # ANCHOR: siteconfig
  # The agent reads this file. The stylus.site block registers the host with
  # your tenant.
  #
  # The placeholders carry no quotation marks. scripts/seed-iso.sh adds the
  # quotation marks and the necessary escapes. A value with a quotation mark or
  # a backslash stays correct YAML.
  - path: /etc/palette/site-config.yaml
    permissions: "0600"
    owner: root:root
    content: |
      #cloud-config
      stylus:
        vip:
          skip: @PALETTE_VIP_SKIP@
        site:
          paletteEndpoint: @PALETTE_ENDPOINT@
          edgeHostToken: @PALETTE_EDGE_TOKEN@
          projectName: @PALETTE_PROJECT@
          name: @HOSTNAME@
  # ANCHOR_END: siteconfig

# ANCHOR: install
# cloud-init runs each runcmd entry with /bin/sh, and on Ubuntu that is dash.
# A bash feature there stops the whole script. An earlier version used
# "set -euxo pipefail" and dash answered:
#
#   /var/lib/cloud/instance/scripts/runcmd: 3: set: Illegal option -o pipefail
#
# cloud-init reported the failure only in its own status, so the host looked
# correct and registered with nothing. The work now lives in a file with a bash
# line at the top, and runcmd calls that file.
  - path: /usr/local/bin/palette-agent-bootstrap
    permissions: "0755"
    owner: root:root
    content: |
      #!/bin/bash
      # Install the Palette agent one time, and write a log for the console.
      set -euo pipefail

      marker=/var/lib/palette-agent-installed
      log=/var/log/palette-agent-install.log
      exec > >(tee -a "$log") 2>&1

      if [ -f "$marker" ]; then
        echo "the agent is already installed"
        exit 0
      fi

      cd /root
      curl --location --fail --retry 3 --show-error \
        --output ./palette-agent-install.sh \
        "@AGENT_SCRIPT_URL@"
      chmod +x ./palette-agent-install.sh

      USERDATA=/etc/palette/site-config.yaml ./palette-agent-install.sh

      date --iso-8601=seconds > "$marker"
      echo "the agent installed correctly"

runcmd:
  - [systemctl, enable, --now, systemd-timesyncd]
  - [/usr/local/bin/palette-agent-bootstrap]

# The installer enables the agent services but does not start them. They run at
# boot stages, so the host registers only after a restart. Without this block a
# host installs correctly, reports success, and never appears in Palette.
#
# cloud-init runs power_state one time for each instance, after every module,
# so this gives one restart and no loop. The condition tests the marker file,
# so a failed installation leaves the host up for you to read the log.
power_state:
  mode: reboot
  condition: test -f /var/lib/palette-agent-installed
  message: restarting one time to start the Palette agent
  timeout: 60
  delay: now
# ANCHOR_END: install

# Write the result of the installation to the console and to a file that
# `just host-status NAME` reads.
final_message: "cloud-init finished after $UPTIME seconds"
