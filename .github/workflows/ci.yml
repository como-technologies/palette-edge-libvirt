# Test the format, the shell scripts, the guards, and the documentation build.
#
# The workflow runs the same `just lint` recipe that you run on the workstation.
# See project rule 1: every action is a recipe.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install mdbook and the preprocessors
        run: |
          cargo install --locked mdbook mdbook-mermaid mdbook-gruvbox

      # genisoimage is for `just test`, not for shellcheck: the seed tests build
      # a real CIDATA ISO with a token that is not one. Without the tool that
      # part of the suite reports a skip, and a skip passes.
      - name: Install shellcheck and genisoimage
        run: sudo apt-get update && sudo apt-get install -y shellcheck genisoimage

      # `just lint` tests the OpenTofu module, and it skips that test when the
      # command is absent. A skipped test reports success, so the module goes
      # untested here unless this step puts OpenTofu on the runner. The recipe
      # needs no root: it puts the one binary in ~/.local/bin.
      - name: Install OpenTofu
        run: |
          just tofu-install
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Lint
        run: just lint
