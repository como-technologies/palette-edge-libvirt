# Build a real cluster on the self-hosted runner, test it, and remove it.
#
# THIS JOB RUNS CODE ON A PERSONAL WORKSTATION, and the repository is public.
# What it can reach if that goes wrong: a shell as the runner account, and the
# Palette API key, which carries every permission of the person who made it.
#
# Three properties keep an outsider off the workstation, and each one is load
# bearing:
#
#   1. There is NO `pull_request` trigger. A fork can fire none of push,
#      schedule, or workflow_dispatch on this repository, so a fork has no path
#      here. This holds whatever the branch settings are.
#   2. A fork pull request needs approval from a maintainer, every time. On a
#      `pull_request` event GitHub runs the workflow files OF THE PULL REQUEST,
#      so a pull request can add a workflow of its own that names this runner.
#      That is the only path here that needs no write access at all, which
#      makes it the gate that matters most. The default policy,
#      `first_time_contributors`, means the first time ONLY, so
#      scripts/ci-setup.sh sets `all_external_contributors`.
#   3. The job takes no third-party action. Every tool it needs is already on
#      the runner, or a recipe of this repository installs it. A third-party
#      action on a mutable tag would run on the workstation with no review at
#      all.
#
# WRITE ACCESS IS THE REMAINING BOUNDARY, and there is no technical gate behind
# it. Anybody who can put a commit on main runs code on the workstation. Branch
# protection does not change that here: every account with write access to this
# repository is an administrator, `enforce_admins` is false, and an
# administrator can turn the rule off in one API call in any case. So the
# protection rule is a guard against a slip, not against a person, and the real
# control is the list of people with write access. Adding a writer grants a
# shell on the workstation. Treat it that way.
#
# What limits the damage rather than preventing it: the runner holds no sudo and
# is NOT in the `libvirt` group, and libvirt runs on qemu:///session, so a
# compromise reaches one unprivileged account. See docs/src/ci.md.
#
# The lab of this workflow is separate from any lab of the person who owns the
# workstation: CLUSTER_NAME and CLUSTER_SUBNET both differ, and the subnet sits
# outside the range that `just new-project` allocates.
name: e2e

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One lab, one job. A second job would take the same network, the same pool, and
# the same host names.
concurrency:
  group: self-hosted-lab
  cancel-in-progress: false

jobs:
  e2e:
    # Insurance. The triggers above carry no pull_request, and this holds even
    # if one is added later.
    if: github.event_name != 'pull_request'

    runs-on: [self-hosted, linux, x64, kvm]

    # The environment holds PALETTE_API_KEY and admits protected branches only,
    # so a run on a side branch executes and receives no credentials. It has NO
    # required reviewer: nothing here waits for a person, and the nightly build
    # is why. Add one at Settings > Environments to gate each run as well as the
    # code, and expect the nightly build to stop until somebody clicks.
    environment: lab

    # A hung registration waits 900s and OpenTofu waits 90 minutes. Neither one
    # may hold the workstation for an afternoon.
    timeout-minutes: 60

    env:
      # The key never reaches a file on the workstation. Every recipe reads it
      # from the environment, so the job leaves no credential behind.
      PALETTE_API_KEY: ${{ secrets.PALETTE_API_KEY }}
      PALETTE_PROJECT: ci-${{ github.run_id }}
      # The settings of the CI lab come from `just ci-env` below, so this file
      # holds no second copy of them.

    steps:
      # No actions/checkout, so the job runs no third-party code. git is on the
      # runner already.
      - name: Take the code
        run: |
          git init --quiet .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --force --quiet FETCH_HEAD
          git clean -ffdx --exclude=.git

      # The runner shell is not a login shell, so it reads no profile. cargo
      # puts just in ~/.cargo/bin, and tofu and kubectl go in ~/.local/bin.
      # Neither is on the default PATH.
      - name: Put the user bin directories on PATH
        run: |
          echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # The justfile is the one record of the CI lab: its name, its subnet, its
      # virtual address, and the pod range. A copy here would drift away from
      # it.
      - name: Take the CI lab settings from the justfile
        run: just ci-env >> "${GITHUB_ENV}"

      - name: Report the settings
        run: just config

      - name: Remove anything that an earlier run left
        run: FORCE=1 just nuke || true

      - name: Install OpenTofu and kubectl
        run: |
          just tofu-install
          just kubectl-install

      - name: Make the project
        run: just new-project "${PALETTE_PROJECT}" "CI run ${{ github.run_id }}"

      - name: Make the machines
        run: just infra-up

      - name: Make the cluster
        run: just cluster-up

      - name: Test the cluster
        run: just cluster-verify

      - name: Remove everything
        if: always()
        run: FORCE=1 just nuke

      - name: Report what is left
        if: always()
        run: just ls
